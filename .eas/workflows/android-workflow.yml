name: Android CI/CD
on:
  push:
    branches:
      - main
      - development

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android app
        run: eas build --profile ${{ github.ref == 'refs/heads/main' && echo 'production' || echo 'development' }} --platform android --non-interactive

      - name: Publish OTA update
        run: eas update --branch ${{ github.ref == 'refs/heads/main' && echo 'main' || echo 'development' }} --non-interactive
